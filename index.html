<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F1FB">
  <title>Шляпа — командная игра</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">🎩 Шляпа</div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" data-action="toggle-sound" aria-label="Включить или выключить звук">🔊</button>
      <button class="icon-btn" id="exitBtn" data-action="exit" aria-label="Выйти из игры" hidden>✕</button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
